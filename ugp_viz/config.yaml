# Default VIZLAB parameters per model.
# CLI / YAML configs inherit and override these.

models:
  phimdl_1d:
    N: 512
    dx: 1.0
    dt: 0.01
    c: 1.0
    m: 0.5
    g: 0.5
    N_phi: 7
    N_chi: 3
    spectral: false
    tau_c_inner_M: 7

  phimdl_3d:
    Nx: 64
    Ny: 64
    Nz: 64
    dx: 1.0
    dt: 0.01
    c: 1.0
    m: 0.5
    g: 0.5
    N_phi: 7
    N_chi: 3

  z7_kg:
    N: 512
    dx: 1.0
    dt: 0.01
    c: 1.0
    m: 0.5
    N_sym: 7
    spectral: true
    tau_c_inner_M: 7

  fca_sync:
    rule: 110
    L: 500
    inner_M: 7
    inner_rule: 110

  afca:
    rule: 110
    L: 500
    inner_M: 7
    warp_min: 0.5
    warp_max: 2.0
    glider_threshold: 0.05

  z7_fmdl:
    L: 25
    dimension: 1
    Nx: 16
    Ny: 16
    Nz: 16

gui:
  default_substeps_per_frame: 1
  spacetime_window: 200
  default_backend: auto

# Output paths are resolved by ugp_viz/paths.py. All artifacts default to
# ugp_viz/runs/{data,figures,videos,screenshots,states}/ so they travel with
# the package. Override at runtime with the UGP_VIZ_RUNS_DIR environment
# variable.
