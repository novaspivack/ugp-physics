# Lean Theorem Registry — public repo registry (authoritative)
# Policy: PUBLIC GitHub repos only (novaspivack/*, isPrivate == false, *lean* name)
# Inventory doc: 000_INF_REPO_INVENTORY.md
# Last synced: 2026-05-31

version: 1
policy: public_only

defaults:
  github_org: novaspivack
  extract_timeout_seconds: 3600
  probe_output_dir: data/ltr/probes
  clone_root: ${LTR_CLONE_ROOT:-/Users/nova}

stub_namespaces:
  - prefix: Mathlib
    stub_id: stub:Mathlib
  - prefix: Std
    stub_id: stub:Std
  - prefix: Init
    stub_id: stub:Init
  - prefix: Lean
    stub_id: stub:Lean
  - prefix: Batteries
    stub_id: stub:Batteries

excluded_private:
  - ugp-lean-exp
  - unified-rigidity-lean
  - domain-semantic-internalization-lean

# ---------------------------------------------------------------------------
# UGP / Physics core
# ---------------------------------------------------------------------------
repos:
  ugp-lean:
    tier: 1
    family: ugp_physics
    github: https://github.com/novaspivack/ugp-lean
    path: ${LTR_CLONE_ROOT:-/Users/nova}/ugp-lean
    package: UgpLean
    namespaces: [UgpLean]
    default_library: UgpLean
    lean_files_approx: 311
    metadata:
      theorems_md: docs/THEOREMS.md  # STALE — ingest only until registry export replaces
      modules_md: docs/MODULES.md
    lake_requires:
      - nems-lean
      - transputation-lean
      - aps-rice-lean
      - rule110-lean
      - ugp-physics-lean
      - mathlib

