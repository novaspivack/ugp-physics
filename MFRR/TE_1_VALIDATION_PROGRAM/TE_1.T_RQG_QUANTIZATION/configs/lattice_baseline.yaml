# Baseline lattice configuration for TE1.T curvature quantization analysis
# Derived from TE1.C slow-roll background and TE1.R PT source settings

lattice:
  dimensions: [64, 64, 64]
  spacing: 0.125  # comoving units (adjust as needed)
  regulator_sigma: auto  # use spacing / sqrt(8 ln 2)

background:
  temperature: 2.725  # Kelvin; can be varied in sweeps
  lambda_psi: 0.70
  alpha1: 1.00
  alpha2: 0.25
  dataset: MFRR/TE_1_VALIDATION_PROGRAM/TE_1.C_RQG/results/phase1_summary.json

pt_source:
  rho_pt: 0.01  # events per unit volume; placeholder derived from TE1.R summary
  summary: MFRR/TE_1_VALIDATION_PROGRAM/TE_1.R_CONTINOUS_MODEL/results/pt_selector/pt_selector_summary.json

execution:
  chunk_size: 8
  max_workers: 4  # adjustable; confirm availability before running
  output: results/kappa_baseline.json
