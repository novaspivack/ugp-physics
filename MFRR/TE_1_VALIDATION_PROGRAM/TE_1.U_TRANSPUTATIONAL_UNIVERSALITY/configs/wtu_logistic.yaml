# Logistic map surrogate configuration for TE1.U universality tests
# Surrogate constructed from discretized logistic PDE using TE1.R continuous model parameters

benchmark:
  name: logistic_surrogate
  description: "Discretized logistic PDE surrogate on 1D grid"
  grid_points: 128
  time_step: 0.01
  timesteps: 200
  parameter_r: 3.7
  initial_condition: sinusoidal

encoding:
  pr0_cli: pr0_system/cli/transmute.py
  embedding:
    type: continuous
    scaling: 0.5
    offset: 0.0
  horizon: 200

metrics:
  epsilon_norm: L2
  spectral_coherence: true
  output_dir: results/wtu/logistic
