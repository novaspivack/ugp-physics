command:
  executable: "python3"
  arguments:
    - "-m"
    - "pr0_system.cli.run_simulation"
    - "--config"
    - "{benchmark_config}"
execution:
  benchmark_config: "configs/pr0_rule110_sim.yaml"
  output_path: "results/wtu/rule110/pr0_output.csv"
  log_path: "results/wtu/rule110/pr0_stdout.log"
  stderr_path: "results/wtu/rule110/pr0_stderr.log"
  csv_to_npy: "results/wtu/rule110/pr0_output.npy"
