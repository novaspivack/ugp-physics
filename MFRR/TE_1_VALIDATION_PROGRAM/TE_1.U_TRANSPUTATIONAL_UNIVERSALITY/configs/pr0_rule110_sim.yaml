integrator:
  type: pr0_final
  mode: al
  size: [64, 64]
  g: 0.1

solitons:
  - x0: 16
    y0: 32
    amplitude: 2.5
    width: 4.0
    velocity_x: 0.15
    sign: +1
  - x0: 48
    y0: 32
    amplitude: 2.5
    width: 4.0
    velocity_x: -0.15
    sign: -1

simulation:
  steps: 256
  dt: 0.01
  record_every: 1
  progress: false

log:
  path: MFRR/TE_1_VALIDATION_PROGRAM/TE_1.U_TRANSPUTATIONAL_UNIVERSALITY/results/wtu/rule110/pr0_output.csv
  fields:
    - timestep
    - density_sum
    - density_delta
    - max_density
    - mean_coherence
    - internal_entropy
    - damping_flux
    - gamma_mean
