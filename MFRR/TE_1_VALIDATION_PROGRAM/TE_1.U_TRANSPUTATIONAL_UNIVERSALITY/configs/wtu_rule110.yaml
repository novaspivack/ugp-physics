# Rule 110 encoding configuration for TE1.U universality tests
# Source trajectories generated via canonical CA evolution (length 256)
# Absolute path placeholders reference dataset directory to be produced by preprocessing script

benchmark:
  name: rule110
  description: "Rule-110 CA metrics (aggregated density/coherence fields)"
  timesteps: 256
  feature_dim: 8

encoding:
  transform: metrics
  horizon: 256

metrics:
  epsilon_norm: L2
  epsilon_tv: true
  normalization: column_std
  output_dir: results/wtu/rule110
