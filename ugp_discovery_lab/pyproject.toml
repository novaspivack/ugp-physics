[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugp-discovery-lab"
version = "0.1.0"
description = "UGP Discovery Lab: lawful-evolution search, kernel laws, RG, CA universality."
authors = [{ name = "Nova Spivack" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
  "numpy>=1.26",
  "scipy>=1.12",
  "sympy>=1.12",
  "psutil>=5.9; platform_system != 'Windows' ",  # optional on Windows
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.scripts]
ugp = "ugp_discovery_lab.cli.ugp:main"

[tool.setuptools.packages.find]
include = ["ugp_discovery_lab*"]
exclude = ["configs*", "UGP_discovery_lab_runs*", "scripts*"]
