suite:
  name: validation_suite
  description: "Complete validation suite for mathematical consistency and stability"
  
  experiments:
    - name: quarterlock_anchor
      config: "configs/experiments/quarterlock_anchor.yaml"
      description: "Anchor Quarter-Lock coefficient to 1/4"
    
    - name: dihedral_consistency
      config: "configs/experiments/dihedral_consistency.yaml"
      description: "Test 2cos(π/n) hypothesis vs empirical data"
    
    - name: lock_stability
      config: "configs/experiments/lock_stability.yaml"
      description: "Stress test lock laws across parameter space"
    
    - name: noether_current_scan
      config: "configs/experiments/noether_current_scan.yaml"
      description: "Scan for conserved currents using Noether's theorem"
    
    - name: rg_cycle_detector
      config: "configs/experiments/rg_cycle_detector.yaml"
      description: "Detect limit cycles in RG flow dynamics"

  run:
    workers: 2
    timeout: 3600
    checkpoint_threshold: 1000
    
  diagnostics:
    - name: algebraic_basis_analysis
      description: "Analyze algebraic basis relationships"
    
    - name: mathematical_consistency_check
      description: "Verify mathematical consistency across experiments"
    
    - name: stability_analysis
      description: "Analyze stability across parameter variations"
