suite:
  name: theory_of_everything_complete
  description: "Complete end-to-end validation: UGP axioms → bare coupling → RG running → experimental prediction with GTE spectrum analysis."

experiments:
  - name: mdl_algebraic_proof_validation
    config: configs/experiments/mdl_algebraic_proof_validation.yaml
    description: "Proves g₁²_bare = 16/125 from UGP axioms and Elegant Kernel"
    
  - name: rg_coupling_runner
    config: configs/experiments/rg_coupling_runner.yaml
    description: "Runs g₁² from unification scale to Z-pole using Standard Model beta function"
    
  - name: ugp_renormalization_demo
    config: configs/experiments/ugp_renormalization_demo.yaml
    description: "Demonstrates the impact of GTE spectrum on RG running and predicts the amount of new physics"
    
  - name: derivation_consistency
    config: configs/experiments/derivation_consistency.yaml
    description: "Validates theoretical consistency across all derivation paths"

report:
  export_md: true
  export_json: true
  create_summary: true
