suite:
  name: "independent_derivations"
  description: "Independent derivations of fundamental constants from UGP kernel"

experiments:
  - name: "rg_fixedpoint_variational"
    config: "configs/experiments/rg_fixedpoint_variational.yaml"
    
  - name: "rg_fixedpoint_spectral"
    config: "configs/experiments/rg_fixedpoint_spectral.yaml"
    
  - name: "u1_coupling_derivation"
    config: "configs/experiments/u1_coupling_derivation.yaml"

execution:
  mode: "analysis-only"
  workers: 8
  timeout: 600

integrity:
  fail_on_warning: true
  require_real_data: true  # For variational and spectral, but not U(1) coupling

report:
  export_md: true
  export_json: true
  include_artifacts: true
