experiments:
  - name: sparse_poly_invariants
    inputs: 
      runs: ["UGP_discovery_lab_runs/**/experiment_results.json"]
    search:
      degree_max: 3
      trials: 200
      subset_size: 5
      lambda_l1: 1.0e-4
      tol_max_abs_dJ: 1.0e-8
      tol_mean_abs_dJ: 1.0e-9
    nulls: 
      n_perm: 200
    report: 
      export_md: true

  - name: permutation_tests
    inputs: 
      runs: ["UGP_discovery_lab_runs/**/experiment_results.json"]
    tests:
      n_permutations: 200
      metrics: ["correlation", "mutual_info", "transfer_entropy"]
    report: 
      export_md: true

  - name: rg_sweep
    inputs:
      runs: ["UGP_discovery_lab_runs/**/experiment_results.json"]
    rg:
      iterations: 8
      crop_policy: "center"
      rescale_policy: "normalize"
      tol_plane: 1e-4
      tol_param: 1e-4
      tol_cycle: 1e-5
    param_grid:
      seeds:
        - [1, 73, 823]
        - [1, 73, 2137]
      windows: [8, 10, 12]
      laws:
        - { c_policy: mersenne, b_policy: fib, a_policy: gte, mirror: d2 }
        - { c_policy: mersenne, b_policy: lucas, a_policy: gte, mirror: d2 }
    report: 
      export_md: true

  - name: dihedral_consistency
    inputs:
      runs: ["UGP_discovery_lab_runs/**/experiment_results.json"]
    orders: [4, 6, 8, 10, 12]
    fit:
      min_points: 1000
      tolerance: 1e-4
    report: 
      export_md: true
