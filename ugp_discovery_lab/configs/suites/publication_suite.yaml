suite:
  name: publication_suite
  description: "Final publication suite generating all definitive results for the Theory of Everything paper"
  
experiments:
  # Core algebraic proof verification
  - name: algebraic_proof_verifier
    config: configs/experiments/algebraic_proof_verifier.yaml
    description: "Re-confirm the bare constant g₁² = 16/125"
    
  # Information geometric validation
  - name: information_geometric_validation
    config: configs/experiments/information_geometric_validation.yaml
    description: "Show the 0.05% corroboration from information geometry"
    
  # MDL model comparison
  - name: mdl_model_comparison
    config: configs/experiments/mdl_model_comparison.yaml
    description: "Show the MDL optimality of the theory"
    
  # 1-loop renormalization finalizer (baseline)
  - name: ugp_renormalization_finalizer
    config: configs/experiments/ugp_renormalization_finalizer.yaml
    description: "Run the final, high-precision 1-loop prediction (1.63% error)"
    
  # 2-loop renormalization finalizer (refinement)
  - name: ugp_renormalization_finalizer_2loop_simple
    config: configs/experiments/ugp_renormalization_finalizer_2loop_simple.yaml
    description: "Run the simplified 2-loop prediction for comparison"
    
  # Hypercharge model optimization
  - name: hypercharge_model_optimizer
    config: configs/experiments/hypercharge_model_optimizer.yaml
    description: "Optimize hypercharge model for improved accuracy"
    
  # Attractor signature analysis
  - name: attractor_signature
    config: configs/experiments/attractor_signature.yaml
    description: "Provide interpretation of the RG attractors"
    
  # Seed partition mapping
  - name: seed_partition_map
    config: configs/experiments/seed_partition_map.yaml
    description: "Generate basin of attraction plot"

execution:
  mode: "analysis-only"  # Use real data only
  workers: 8
  timeout: 3600  # 1 hour timeout per experiment
  
reporting:
  generate_plots: true
  export_json: true
  export_md: true
  create_summary: true
