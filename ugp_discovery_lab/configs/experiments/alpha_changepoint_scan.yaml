experiment:
  name: alpha_changepoint_scan
  description: "Detect change-points in alpha evolution over time using binary segmentation"
  
  inputs:
    runs:
      - "UGP_discovery_lab_runs/exp_*/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_*/results/reports/*_results.json"
  
  rolling:
    win: 64        # Window size for rolling alpha estimation
    stride: 8      # Step size for rolling window
  
  penalty: 10.0    # Penalty parameter for change-point detection
  
  integrity:
    fail_on_warning: true
    require_real_data: true
