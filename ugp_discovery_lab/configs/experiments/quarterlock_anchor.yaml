experiment:
  name: quarterlock_anchor
  description: "Refit Quarter-Lock on independent data to anchor the coefficient exactly."
  inputs:
    runs:
      - "UGP_discovery_lab_runs/**/LE_gte_*_summary.json"
  fit:
    model: "kM = kG + alpha*kL"
    target_value: "1/4"
    tol_abs: 1e-6
    min_points: 500
  report:
    export_md: true
    export_json: true
