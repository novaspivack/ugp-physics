experiment:
  name: noether_current_scan
  description: "Scan for conserved currents using Noether's theorem approach"
  scan:
    max_degree: 3
    max_coefficients: 8
    tolerance: 1e-6
    test_forms:
      - "linear"
      - "quadratic"
      - "cubic"
      - "physics_inspired"
  report:
    export_md: true
    export_json: true
