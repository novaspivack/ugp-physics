experiment:
  name: rg_sweep
  description: "RG sweep focused on Attractor B (+0.075413) validation"
  
  inputs:
    runs: []  # Analysis-only mode
    
  rg:
    iterations: 12
    crop_policy: "center"
    rescale_policy: "normalize"
    tol_plane: 1e-4
    tol_param: 1e-4
    tol_cycle: 1e-5
    
  param_grid:
    seeds:
      - [3, 97, 2203]  # Known Attractor B seed
      - [3, 97, 2203]  # Duplicate for more data
      - [3, 97, 2203]  # Triple for robust validation
    windows: [8, 9, 10, 11, 12, 13, 14, 15]  # Multiple window sizes
    laws:
      - { c_policy: mersenne, b_policy: fib,   a_policy: gte, mirror: d2 }
      - { c_policy: mersenne, b_policy: lucas, a_policy: gte, mirror: d2 }
      - { c_policy: mersenne, b_policy: fib,   a_policy: gte, mirror: d4 }
      - { c_policy: mersenne, b_policy: fib,   a_policy: gte, mirror: d5 }
      - { c_policy: mersenne, b_policy: fib,   a_policy: gte, mirror: d6 }
      - { c_policy: repunit,  repunit_base: 3, b_policy: fib, a_policy: gte, mirror: d2 }
      - { c_policy: repunit,  repunit_base: 3, b_policy: lucas, a_policy: gte, mirror: d2 }
  
  report:
    export_md: true
    export_json: true
    export_plots: true
