experiment:
  name: permutation_tests
  description: "Permutation tests for statistical significance of discovered patterns"
  
  inputs:
    runs:
      - "UGP_discovery_lab_runs/exp_*/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_*/results/reports/*_results.json"
  
  tests:
    n_permutations: 200  # Number of permutations for null hypothesis testing
    what: ["alpha_fit"]  # What to test: alpha_fit, noether_quadratic, etc.
  
  integrity:
    fail_on_warning: true
    require_real_data: true
