experiment:
  name: ugp_renormalization_finalizer_2loop_simple
  description: "Simplified 2-loop RGE correction - adds conservative 2-loop self-coupling term to 1-loop U(1) beta function."

inputs:
  # The bare U(1) coupling at unification scale (theoretically derived)
  bare_g1_squared: "16/125"
  
  # Energy scales
  unification_scale_gev: 1.22e19
  z_pole_mass_gev: 91.1876
  
  # Complete particle catalog from Discovery Engine
  particle_catalog_path: "data/particle_catalog/catalog.parquet"

hypercharge_model:
  # Parameters for the assign_hypercharge function
  g_factor: 0.3333333333333333
  c_state_latched_15_offset: 0.16666666666666666

target:
  # Experimental value of g₁² at Z-pole
  experimental_g1_squared_at_z_pole: 0.1279

report:
  export_md: true
  export_json: true
  plots: true
