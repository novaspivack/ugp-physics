experiment:
  name: rg_long_cycles
  description: "Detect long cycles in RG flow trajectories on real UGP data"
  
  inputs:
    runs:
      - "UGP_discovery_lab_runs/exp_*/results/reports/rg_flow_*.json"
      - "UGP_discovery_lab_runs/exp_*/results/reports/experiment_results.json"
  
  detection:
    max_cycle_length: 20    # Maximum cycle length to detect
    tolerance: 1e-6        # Distance tolerance for cycle detection
    min_cycle_duration: 3   # Minimum consecutive positions for valid cycle
  
  integrity:
    fail_on_warning: true
    require_real_data: true
