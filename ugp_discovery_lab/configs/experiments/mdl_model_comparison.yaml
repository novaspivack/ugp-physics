experiment:
  name: mdl_model_comparison
  description: "Final MDL verdict on g1_squared, comparing the algebraic proof to alternatives."
  
hypotheses:
  - name: "H_algebraic_proof"
    formula: "16/125"
    description: "Algebraic proof: g₁² = 1/((k_a k_b k_c)² · 5³) = 16/125"
  - name: "H_best_fit_float"
    formula: "auto_minimize"  # Special value to trigger high-precision optimizer
    description: "Best fit from data (high-precision optimizer)"
  - name: "H_bare_ka"
    formula: "1/8"
    description: "Bare constant: g₁² = k_a = 1/8"
  - name: "H_old_formula"
    formula: "scaled_geometric_mean"  # Previous heuristic (6.73% error)
    description: "Previous phenomenological formula"
  - name: "H_null"
    formula: "1/8"
    description: "Null hypothesis (bare constant)"
    
inputs:
  g2_squared: 0.425
  higgs_vev_gev: 246.22
  
targets:
  sin_sq_theta_w: 0.23129
  sin_sq_theta_w_error: 0.00013
  M_Z_gev: 91.1876
  M_Z_error: 0.0021
  M_W_gev: 80.379
  M_W_error: 0.009
  
report:
  export_md: true
  export_json: true
