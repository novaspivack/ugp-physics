experiment:
  name: info_theory_scan
  description: "Information-theoretic analysis of UGP dynamics using mutual information and transfer entropy"
  
  inputs:
    runs:
      - "UGP_discovery_lab_runs/exp_*/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_*/results/reports/*_results.json"
  
  settings:
    bins: 16          # Histogram bins for MI/TE estimation
    max_lag: 3        # Maximum lag for transfer entropy analysis
  
  integrity:
    fail_on_warning: true
    require_real_data: true
