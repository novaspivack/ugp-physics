# Configuration for UGP Seesaw v2 Complementary Geometry Experiment
# Seesaw v2 with complementary right-handed geometry to avoid frame alignment issues

experiment:
  name: ugp_seesaw_v2_complementary_geometry
  description: "Seesaw v2 with complementary right-handed geometry to avoid frame alignment issues"
  inputs:
    runs:
      - "canonical_gte_triples.json"

# Seesaw v2 Framework
seesaw_v2_framework:
  fit_free: true
  kernel_locked: true
  complementary_geometry: true
  discrete_scan_only: true
  ckm_preservation: true

# Seesaw v2 Parameters (All Kernel-Locked)
seesaw_v2_parameters:
  # UGP kernel constants (exact)
  L_residual: 9.382
  k_L: 0.019737
  phi: 1.618033988749895
  
  # Discrete parameter ranges
  E_rotations: [0, 1, 2, 3]  # Quarter-turn indices
  kappa_shifts: [0, 1, 2]    # κ angle shifts  
  phi_biases: [1.0, 1.618033988749895, 0.6180339887498948]  # φ bias options

# Complementary Geometry Strategy
complementary_geometry:
  right_handed_E_rotation: true
  orthogonalized_A1_axis: true
  distinct_A2_orientation: true
  basis_covariant_seesaw: true

# Diagnostic Quantities
diagnostics:
  commutator_norm: true
  E_overlap: true
  seesaw_condition_numbers: true
  frame_alignment_analysis: true

# Expected Outcomes
expected_outcomes:
  pmns_theta23_improvement: true
  frame_misalignment: true
  seesaw_stability: true
  theoretical_consistency: true
