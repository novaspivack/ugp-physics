experiment:
  name: rg_coupling_runner
  description: "Runs the bare g1_squared from the unification scale down to the Z-pole using one-loop RGE."

inputs:
  bare_g1_squared: "16/125"  # Theoretical value from UGP algebraic proof
  unification_scale_gev: 1.22e19  # Planck Scale
  z_pole_mass_gev: 91.1876

sm_parameters:
  b1_coefficient: "41/6"  # Standard Model one-loop beta function coefficient

target:
  experimental_g1_squared_at_z_pole: 0.1279  # From PDG experimental data

report:
  export_md: true
  export_json: true
