experiment:
  name: holographic_thermodynamics
  description: "Tests the conservation of a combined entropy + holographic information budget."
  inputs:
    runs:
      - "pr1_trajectory_data.json"  # Uses trajectory data

analysis:
  boundary_width: 2  # Number of cells to define as the "boundary"
  scaling_constant_C: 1.0  # Scaling factor for holographic information
  trajectory_length: 1000  # Number of time steps to analyze
  
conservation_thresholds:
  excellent_cv: 0.05  # CV threshold for "excellent" conservation
  good_cv: 0.15       # CV threshold for "good" conservation
  significant_trend: 0.05  # p-value threshold for significant trend
  
correlation_thresholds:
  anti_correlation_threshold: -0.1  # Minimum correlation for anti-correlation
  compensation_efficiency_threshold: 0.3  # Minimum efficiency for good compensation
  
report:
  export_md: true
  export_json: true
  export_csv: true
  plots: true
  
artifacts:
  - "holographic_thermodynamics_results.json"
  - "information_budget_time_series.csv"
  - "conservation_analysis.csv"
  - "correlation_analysis.csv"
  - "plot_information_budget.png"
  - "plot_conservation_comparison.png"
  - "plot_entropy_holographic_correlation.png"
