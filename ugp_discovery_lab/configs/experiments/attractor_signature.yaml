experiment:
  name: attractor_signature
  description: "Calculates sophisticated invariants for trajectories in each RG attractor basin."
  inputs:
    runs:
      - "foundational_validation_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_163933/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_163855/results/reports/experiment_results.json"
  analysis:
    ks_test_alpha: 0.01  # Significance level for comparing distributions
  report:
    export_md: true
    export_json: true
    plots: true  # Generate comparison box plots for each invariant
  integrity:
    fail_on_warning: true
    require_real_data: true
