experiment:
  name: kernel_fit
  description: "Generic kernel plane fitting across different UGP evolutions"
  sources:
    - { name: "LE_gte_fib", run_dir: "UGP_discovery_lab_runs/exp_20250917_163933", glob: "*.json" }
    - { name: "LE_gte_lucas", run_dir: "UGP_discovery_lab_runs/exp_20250917_163855", glob: "*.json" }
  fit:
    models:
      - { form: "kM = kG + alpha*kL", max_denominator: 16 }
      - { form: "kM = a*kG + b*kL + c", max_denominator: 16 }
    thresholds:
      min_points: 50
      min_r2: 0.995
