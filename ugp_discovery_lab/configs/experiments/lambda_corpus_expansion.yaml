experiment:
  name: lambda_corpus_expansion
  description: "Expand formal corpus for robust MDL calculation with full ML schemas"
  inputs:
    runs:
      - "lambda_derivation_data.json"  # Uses Λ derivation data

physics:
  hubble_constant: 67.4  # km/s/Mpc
  omega_lambda: 0.689
  speed_of_light: 2.998e8  # m/s

expansion:
  include_full_schemas: true  # Include complete ML-3/ML-5/ML-6 schemas
  add_repeated_patterns: true  # Add repeated patterns for structural redundancy
  structural_redundancy_factor: 3  # Number of repetitions for each pattern

validation:
  expansion_threshold: 2.0  # Minimum 2x expansion ratio
  redundancy_threshold: 0.1  # Minimum structural redundancy
  improvement_threshold: 0.1  # Minimum 10% MDL improvement

report:
  export_md: true
  export_json: true
  export_csv: true
  plots: true
  
artifacts:
  - "lambda_corpus_expansion_results.json"
  - "original_vs_expanded_tokens.csv"
  - "structural_redundancy_analysis.csv"
  - "mdl_improvement_analysis.csv"
  - "plot_corpus_expansion_comparison.png"
  - "plot_structural_redundancy_breakdown.png"
  - "plot_mdl_compression_ratio.png"
