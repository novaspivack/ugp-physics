experiment:
  name: index_lock
  description: "Detect fixed |q_t - q_{t-1}| locks at ridge/mirror events"
  inputs:
    runs:
      - "UGP_discovery_lab_runs/exp_20250917_110313"
  detection:
    event_types: ["ridge", "mirror"]
    tolerance: 0           # exact equality (0) or small integer tolerance
    min_support: 20        # minimum number of events to accept a lock
