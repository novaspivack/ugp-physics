experiment:
  name: dihedral_lock
  description: "Search Dihedral-Lock planes for n ∈ {5,6,8,10,12}"
  dihedral:
    n_list: [5,6,8,10,12]
    windows: [10, 11]      # levels n for ridge geometry
    samples_per_class: 20  # generate random survivor windows with D_n-tiling constraints
  fit:
    max_denominator: 16
    min_r2: 0.995
  run:
    steps: 64
  diagnostics:
    kernel_plane_fit: true
