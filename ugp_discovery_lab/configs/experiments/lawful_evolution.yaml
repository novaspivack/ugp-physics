experiment:
  name: lawful_evolution
  description: "Generate kernel series data (kG, kL, kM) for independent alpha estimators"
  le_config:
    c_policy: mersenne
    b_policy: fib
    a_policy: gte
    mirror: d2
    triggers:
      ridge: true
      mirror: true
  run:
    steps: 200
    windows: [10, 11, 12, 13, 14]   # levels n
    seed: [1, 73, 823, 2137, 2203]
  diagnostics:
    kernel_plane_fit: true
    index_lock: true
    ca_universality: false
