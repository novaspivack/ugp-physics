experiment:
  name: rg_flow
  description: "Iterate RG operator and detect fixed points/cycles"
  rg:
    iterations: 8
    initial_window: 64
    crop_policy: "center"       # or "boundary"
    rescale_policy: "normalize" # e.g., normalize coefficients
  input:
    source_run: "UGP_discovery_lab_runs/exp_20250917_110313"
  fit:
    model: "kM = kG + alpha*kL"
    max_denominator: 16
  stopping:
    tol_plane: 1e-3
    tol_param: 1e-3
    tol_cycle: 1e-4
