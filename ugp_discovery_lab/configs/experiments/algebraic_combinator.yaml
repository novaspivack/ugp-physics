experiment:
  name: algebraic_combinator
  description: "Systematic search for an algebraic expression for g1_squared."
  
search:
  generations: 1000
  population_size: 500
  max_complexity: 10
  
target:
  g1_squared: 0.128  # Based on number-theoretic analysis (128 = 2^7, 0.128 = 16/125 = 2^4/5^3)
  
report:
  export_md: true
  export_json: true
  top_n_candidates: 10
