experiment:
  name: ugp_volume_calculus
  description: "Calculates the ratio of computational to symmetric volume in GTE trajectories."
  
inputs:
  runs:
    - "UGP_discovery_lab_runs/exp_*/results/reports/experiment_results.json"
    - "UGP_discovery_lab_runs/exp_*/results/reports/lawful_evolution_*.json"
    - "UGP_discovery_lab_runs/exp_*/results/reports/ugp_trajectory_generation_*.json"
    
analysis:
  prime_factor_limit: 1000  # For b analysis
  alpha_entropy_bins: 256   # For alpha distribution
  
report:
  export_md: true
  export_json: true
