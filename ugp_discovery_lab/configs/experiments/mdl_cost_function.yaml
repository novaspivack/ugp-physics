experiment:
  name: mdl_cost_function
  description: "Finds the MDL-optimal value for g1_squared by minimizing L_model + L_data."
  
search:
  g1_squared_min: 0.120
  g1_squared_max: 0.140
  steps: 2001  # Ensure 0.128 is on the grid if step size is 1e-5
  max_denominator: 10000
  
inputs:
  g2_squared: 0.425
  higgs_vev_gev: 246.22
  
targets:
  sin_sq_theta_w: 0.23129
  sin_sq_theta_w_error: 0.00013
  M_Z_gev: 91.1876
  M_Z_error: 0.0021
  M_W_gev: 80.379
  M_W_error: 0.009
  
report:
  export_md: true
  export_json: true
  plots: true
