experiment:
  name: mdl_algebraic_proof_validation
  description: "Validate the algebraic proof that g₁² = 16/125 using MDL principle"

hypotheses:
  - name: "H_algebraic_proof"
    type: "algebraic_proof"
    description: "g₁² = 1/((k_a k_b k_c)² · 5³) = 16/125 from algebraic proof"
    
  - name: "H_best_fit_float"
    type: "best_fit_float"
    description: "Best floating-point fit to experimental data"
    
  - name: "H_bare_ka"
    type: "bare_ka"
    description: "g₁² = k_a = 1/8 (simplest possible)"
    
  - name: "H_old_formula"
    type: "old_formula"
    description: "Previous scaled_geometric_mean formula (0.136619)"
    
  - name: "H_null"
    type: "null"
    description: "Null hypothesis: g₁² = 1/8"

inputs:
  g2_squared: 0.425
  higgs_vev_gev: 246.22
  
targets:
  # PDG 2023 experimental values
  sin_sq_theta_w: 0.23121
  sin_sq_theta_w_error: 0.00013
  M_Z_gev: 91.1876
  M_Z_error: 0.0021
  M_W_gev: 80.377
  M_W_error: 0.009

report:
  export_md: true
  export_json: true
