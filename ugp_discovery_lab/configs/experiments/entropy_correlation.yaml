experiment:
  name: entropy_correlation
  description: "Tests the correlation between entropy changes and long-range information storage."
  inputs:
    # This needs a run that saved the full PR-1 lattice state at each step
    pr1_trajectory_run: "UGP_discovery_lab_runs/**/exp_*/results/reports/experiment_results.json"
    runs:
      - "foundational_validation_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_163933/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_163855/results/reports/experiment_results.json"
  analysis:
    correlation_method: "pearson"
  report:
    export_md: true
    export_json: true
    plots: true  # Plot S(t) and C(t) on the same time axis
  integrity:
    fail_on_warning: true
    require_real_data: true
