experiment:
  name: rg_seed_partition
  description: "Classify seeds into RG basins from the canonical rg_sweep run"
  inputs:
    runs:
      - "UGP_discovery_lab_runs/exp_20260412_rg_sweep_full/results/reports/experiment_results.json"
  labels:
    alpha_bins:
      - [-0.09, -0.08, "A"]
      - [ 0.07,  0.08, "B"]
      - [ 0.26,  0.27, "C"]
  integrity:
    fail_on_warning: false
    require_real_data: false
  report:
    export_md: true
    export_json: true
