experiment:
  name: sparse_poly_invariants
  description: "Random-sparse polynomial invariant scan up to degree 3"
  inputs:
    runs:
      - "UGP_discovery_lab_runs/**/experiment_results.json"
  search:
    degree_max: 3
    trials: 200          # random subsets to test
    subset_size: 5       # number of monomials per trial
    lambda_l1: 1.0e-4
    tol_max_abs_dJ: 1.0e-8
    tol_mean_abs_dJ: 1.0e-9
  nulls:
    n_perm: 200          # permutation control
  integrity:
    fail_on_warning: true
    require_real_data: true
  report:
    export_md: true
    export_json: true
