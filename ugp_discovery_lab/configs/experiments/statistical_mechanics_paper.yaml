# PRE paper (*Dynamics & Universality*) — statistical mechanics on real GTE data.
# Points directly at the archived lawful_evolution experiment_results.json files
# that contain evolution_history (a, b, c) triples.
experiment:
  name: statistical_mechanics
  description: "Verify emergent irreversibility (Second Law) on real GTE lawful-evolution trajectories."

  inputs:
    runs:
      - "UGP_discovery_lab_runs/exp_20250917_112647/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_163855/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_163933/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_203952/results/reports/experiment_results.json"

  coarse_graining:
    n_bins_b: 16
    n_bins_c: 16

  verification:
    monotonicity_tolerance: 1.0e-9

  report:
    export_md: true
    export_json: true
    plots: true
