experiment:
  name: persistence_cv
  description: "Out-of-sample persistence of alpha with K-fold CV"
inputs:
  runs:
    - "results/reports/rg_sweep_summary.json"
  cv:
    K: 5
    cv_max_delta: 1.0e-4
  integrity:
    fail_on_warning: true
    require_real_data: true
  report:
    export_md: true
    export_json: true
