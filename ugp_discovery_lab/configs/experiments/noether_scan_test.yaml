experiment:
  name: noether_current_scan
  description: "Test Noether current scan with limited forms"
  
  scan:
    max_degree: 1
    max_coefficients: 3
    tolerance: 1e-6
    
  search:
    grid:
      coeffs: [-1, 0, 1]  # Smaller grid for testing
      
  run:
    steps: 100
    window: 64
    seed: [42]
    
  report:
    export_md: true
    export_json: true
