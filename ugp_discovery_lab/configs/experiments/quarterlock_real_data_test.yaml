experiment:
  name: quarterlock_anchor
  description: "Test Quarter-Lock anchor on REAL UGP data with analysis-only mode"
  
  inputs:
    runs:
      - "UGP_discovery_lab_runs/exp_20250917_130838/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_130852/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_130902/results/reports/experiment_results.json"
      
  fit:
    model: "kM = kG + alpha*kL"
    target_value: "1/4"
    tol_abs: 1e-4  # Relaxed tolerance for real data
    min_points: 100
    
  report:
    export_md: true
    export_json: true
    include_integrity_report: true
