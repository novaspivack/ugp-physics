experiment:
  name: reversible_core
  description: "GTE-REVERSIBLE-CORE: reversible UWCA with entropy tracking"
  le_config:
    c_policy: mersenne
    b_policy: fib
    a_policy: gte
    mirror: d2
    reversible: true
    entropy_tracking: true
  run:
    steps: 200
    windows: [10, 11, 12]
    seed: [1, 73, 823]
  diagnostics:
    information_conservation: true
    entropy_analysis: true
