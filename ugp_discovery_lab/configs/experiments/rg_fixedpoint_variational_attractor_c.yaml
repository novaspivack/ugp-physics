experiment:
  name: rg_fixedpoint_variational_attractor_c
  description: "Independent variational estimate of Attractor C alpha* via drift-minimizing plane"
  inputs:
    runs:
      - "UGP_discovery_lab_runs/exp_20250917_171125/**/*.json"
  variational:
    win: 64
    stride: 16
    lambda_drift: 1.0
    alpha_bounds: [-0.5, 0.5]
    tol: 1e-8
  integrity:
    fail_on_warning: true
    require_real_data: true
  report:
    export_md: true
    export_json: true
