experiment:
  name: ugp_seesaw_pmns_refined
  description: "UGP-Native Seesaw Mechanism - Refined Implementation with Enhanced Features"
  inputs:
    runs:
      - "canonical_gte_triples.json"

options:
  # Locked Perfect CKM Configuration (NON-NEGOTIABLE)
  locked_ckm_configuration:
    tau0_scale: 1.5
    epsilon_scale: 0.8
    epsilon_prime_scale: 4.0
    normalization_method: "frobenius"
    down_sector_permutation: [0, 2, 1]
  
  # Enhanced Right-handed Neutrino Triples for Seesaw Mechanism
  nu_R_triples:
    nu_e_R: [1, 823, 1]    # Swapped b,c from ν_L with enhanced geometry
    nu_mu_R: [9, 1023, 1]  # Swapped b,c from ν_L with enhanced geometry
    nu_tau_R: [5, 65535, 1] # Swapped b,c from ν_L with enhanced geometry
  
  # PDG Target Values
  pdg_targets:
    ckm_angles: [33.44, 8.57, 49.2]  # degrees
    pmns_angles: [33.44, 8.57, 49.0]  # degrees
    ckm_elements: [0.2245, 0.041, 0.00365]
  
  # Enhanced Seesaw Mechanism Parameters
  seesaw_configuration:
    M_D_construction: "enhanced_geometric_overlap"  # Enhanced geometric overlap with realistic scales
    M_R_construction: "enhanced_symmetric_gram_matrix"  # Enhanced symmetric Gram matrix with hierarchy
    seesaw_formula: "M_eff = -M_D M_R⁻¹ M_Dᵀ"
    diagonalization_method: "enhanced_schur_decomposition"
    
  # Realistic Seesaw Scales
  seesaw_scales:
    M_R_scale: 1e14  # Right-handed neutrino mass scale (GeV)
    M_D_scale: 100   # Dirac mass scale (GeV)
    hierarchy_factor: 1e-3  # Light neutrino mass hierarchy
    
  # Enhanced Validation Criteria
  validation_criteria:
    ckm_error_threshold: 0.05  # <5% error for CKM preservation
    pmns_error_threshold: 0.30  # <30% error for PMNS achievement (refined)
    breakthrough_threshold: 0.25  # <25% average PMNS error for breakthrough (refined)
    
  # Enhanced Numerical Stability
  numerical_stability:
    regularization_factor: 1e-6
    overflow_protection: true
    nan_inf_detection: true
    fallback_to_identity: true
    enhanced_condition_checking: true
    schur_decomposition_fallback: true

# Enhanced Analysis Configuration
analysis:
  detailed_output: true
  save_intermediate_matrices: true
  generate_validation_report: true
  breakthrough_analysis: true
  enhanced_feature_analysis: true
  numerical_stability_report: true
  
# Output Configuration  
output:
  save_results: true
  save_matrices: true
  save_validation: true
  save_enhanced_features: true
  format: "json"
