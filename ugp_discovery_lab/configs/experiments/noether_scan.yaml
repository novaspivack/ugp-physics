experiment:
  name: noether_current_scan
  description: "Search for conserved linear forms J(M,G,L) under PR-1"
  
  search:
    basis: ["M","G","L"]
    degree: 1
    grid:
      coeffs: [-3, -2, -1, 0, 1, 2, 3]
    tolerance: 1e-8
    max_hits: 5
    
  runs:
    - "UGP_discovery_lab_runs/**/LE_*_summary.json"
    
  report:
    export_md: true
    export_json: true
    
  validation:
    min_steps: 100
    max_steps: 500
    require_real_data: false
