experiment:
  name: seed_classifier
  description: "Trains a decision tree to predict attractor basins from initial seed properties."
  inputs:
    seed_partition_map: "foundational_validation_results.json"
    runs:
      - "foundational_validation_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_163933/results/reports/experiment_results.json"
      - "UGP_discovery_lab_runs/exp_20250917_163855/results/reports/experiment_results.json"
  model:
    max_depth: 5  # Keep the tree simple and interpretable
    cv_folds: 10
  report:
    export_md: true
    export_json: true
    plots: true  # Generate a plot of the decision tree
  integrity:
    fail_on_warning: true
    require_real_data: true
