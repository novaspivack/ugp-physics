experiment:
  name: rg_cycle_detector
  description: "Detect limit cycles in RG flow dynamics"
  detection:
    max_cycles: 3
    cycle_tolerance: 1e-4
    min_cycle_length: 2
    clustering_eps: 1e-4
    min_samples: 2
  inputs:
    runs:
      - "UGP_discovery_lab_runs/**/rg_flow_*_summary.json"
  report:
    export_md: true
    export_json: true
