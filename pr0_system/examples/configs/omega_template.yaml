integrator:
  type: pr0_final           # or "unified"
  mode: al                  # ignored unless type: unified with overlays
  size: [64, 64]
  g: 0.2

solitons:
  - x0: 20
    y0: 32
    amplitude: 3.0
    width: 4.0
    velocity_x: 0.18
    sign: +1
  - x0: 44
    y0: 32
    amplitude: 3.0
    width: 4.0
    velocity_x: -0.18
    sign: -1

simulation:
  steps: 4000
  dt: 0.01
  record_every: 200
  progress: true

log:
  path: pr0_logs/omega_run.csv
  fields:
    - timestep
    - density_sum
    - density_delta
    - max_density
    - mean_coherence
    - internal_entropy
    - damping_flux


